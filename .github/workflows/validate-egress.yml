name: Scraper CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 检出代码（v4 在 Node 24 下通常还能跑，但建议测试 v5）
      - uses: actions/checkout@v4
      
      # 2. 设置 Python（v5 是 Node 24 安全版本）
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      # 3. 安装依赖
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      # 4. 运行你的脚本
      - name: Run scraper
        run: python main.py


            - name: Run scraper with display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb  # 虚拟显示
          xvfb-run python main.py       # 用 xvfb 包装运行
