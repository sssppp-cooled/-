proxy:
  proxy_file: "proxies.json"
  max_fail: 3
  cooldown_minutes: 30

browser:
  headless: false
  window_size: "1920,1080"
  lang: "en-US"
  timezone: "America/New_York"

delays:
  page_load: [10, 18]
  between_queries: [20, 45]
  typing: [0.08, 0.3]
  scroll_pause: [1.0, 3.0]
  post_search_read: [15, 30]

scraping:
  max_retries: 3
  output_file: "data/output.csv"
  batch_size: 10
