docs_yml = '''name: Docs

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pytest black mypy

      - name: Lint with black
        run: black --check ios_traffic_intel/

      - name: Type check with mypy
        run: mypy ios_traffic_intel/ --ignore-missing-imports

      - name: Test with pytest
        run: pytest tests/ -v
'''

with open(os.path.join(workflows_en, "docs.yml"), "w", encoding="utf-8") as f:
    f.write(docs_yml)
